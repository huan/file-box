name: NPM

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run lint and unit tests with coverage
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run browser tests with coverage
        run: npm run test:unit:browser

      - name: Verify the browser runner reports failure
        run: |
          if npm run test:unit:browser -- tests/fixtures/browser-failure.fixture.ts > browser-failure.log 2>&1; then
            cat browser-failure.log
            exit 1
          fi
          cat browser-failure.log
          grep -F 'FileBox browser runner failure fixture' browser-failure.log

  deno:
    name: Deno unit tests (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.8
      - run: npm ci
      - run: npm run test:unit:deno

  pack:
    name: Pack
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install Dependencies
        run: npm ci

      - name: Generate Version
        run: ./scripts/generate-version.sh

      - name: Pack Testing
        run: ./scripts/npm-pack-testing.sh

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    name: Publish
    needs: [validate, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: npm ci

      - name: Generate Version
        run: ./scripts/generate-version.sh

      - name: Set Publish Config
        run: ./scripts/package-publish-config-tag.sh

      - name: Build Dist
        run: npm run dist

      - name: Check Branch
        id: check-branch
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/heads/(main|v[0-9]+\.[0-9]+.*)$ ]]; then
            echo "match=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to NPM
        if: steps.check-branch.outputs.match == 'true'
        run: |
          NAME=$(node -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).name)")
          VERSION=$(node -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")
          if npx version-exists "$NAME" "$VERSION"
          then echo "$NAME@$VERSION exists on NPM, skipped."
          else npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Is Not A Publish Branch
        if: steps.check-branch.outputs.match != 'true'
        run: echo 'Not A Publish Branch'
